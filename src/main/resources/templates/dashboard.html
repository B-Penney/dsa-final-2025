<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BST Dashboard</title>
    <style>
        /* Basic styling */
        body {
            font-family: 'Times New Roman, cambria',serif;
            background: #4f032a;
            margin: 0;
            padding: 0;
        }
        .container {
            margin: 50px auto;
            max-width: 800px;
            background: #FEC3A6;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h1, h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            font-size: 1.1em;
            color: #444;
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .button-group {
            text-align: center;
            margin-top: 20px;
        }
        button {
            background-color: #fe6d73;
            border: none;
            color: #fff;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            margin: 10px;
        }
        button:hover {
            background-color: #ef476f;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 30px;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #fe6d73;
            color: #fff;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Entry Form -->
    <h1>Create a Binary Search Tree</h1>
    <form action="/process-numbers" method="post">
        <div class="form-group">
            <label for="numbers">Enter numbers (comma separated):</label>
            <input type="text" id="numbers" name="numbers" required>
        </div>
        <div class="button-group">
            <button type="submit">Submit</button>
        </div>
    </form>

    <!-- Previous Trees -->
    <h2>Previous Tree Results</h2>
    <table>
        <tr>
            <th>ID</th>
            <th>Input Numbers</th>
            <th>Tree Structure (JSON)</th>
        </tr>
        <tr th:each="result : ${results}">
            <td th:text="${result.id}"></td>
            <td th:text="${result.inputNumbers}"></td>
            <td th:text="${result.treeJson}"></td>
        </tr>
    </table>
</div>
</body>
</html>
