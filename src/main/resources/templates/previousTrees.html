<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <title>Previous Trees</title>
</head>
<body>
<h1>Previous Tree Results</h1>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Input Numbers</th>
        <th>Tree Structure (JSON)</th>
    </tr>
    <tr th:each="result : ${results}">
        <td th:text="${result.id}"></td>
        <td th:text="${result.inputNumbers}"></td>
        <td th:text="${result.treeJson}"></td>
    </tr>
</table>
<br/>
<a href="/enter-numbers">Back to Entry</a>
</body>
</html>
